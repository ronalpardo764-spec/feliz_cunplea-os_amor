<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>¡Feliz Cumpleaños, Mi Amor!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ff85b3;
    }

    /* Pantalla 1: Pregunta de cumpleaños */
    #pantalla-inicio {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, #ff9ebb 0%, #ff6b9d 100%);
      z-index: 30;
    }

    #pantalla-inicio h1 {
      color: #ffffff;
      font-size: clamp(1.45rem, 5.5vw, 2.2rem);
      line-height: 1.3;
      max-width: 560px;
      margin-bottom: 34px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
    }

    .zona-botones {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-si {
      background: #ff2a75;
      color: #ffffff;
      z-index: 5;
    }

    #btn-no {
      background: #ffffff;
      color: #ff2a75;
      position: relative;
      z-index: 6;
      transition: left 0.14s ease-out, top 0.14s ease-out;
    }

    /* Pantalla 2: Celebración */
    #pantalla-celebra {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, #ff8ab6 0%, #ff4788 100%);
      color: #ffffff;
      z-index: 25;
      overflow: hidden;
    }

    #pantalla-celebra h2 {
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      z-index: 2;
    }

    #pantalla-celebra p {
      font-size: 1.1rem;
      max-width: 440px;
      margin-bottom: 28px;
      z-index: 2;
    }

    #btn-regalo {
      background: #ffffff;
      color: #ff2a75;
      font-size: 1.15rem;
      padding: 15px 30px;
      z-index: 2;
    }

    .corazon-flotante {
      position: absolute;
      bottom: -40px;
      pointer-events: none;
      z-index: 1;
      animation: subirCorazon linear forwards;
    }

    @keyframes subirCorazon {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.95;
      }
      100% {
        transform: translateY(-115vh) scale(1.25);
        opacity: 0;
      }
    }

    /* Pantalla 3: Agujero negro central + Universo 3D lleno de mensajes */
    #pantalla-universo {
      position: fixed;
      inset: 0;
      display: none;
      background: radial-gradient(circle at 50% 50%, #4d1208 0%, #240705 38%, #0a0408 75%, #040306 100%);
      overflow: hidden;
      touch-action: none;
      z-index: 20;
    }

    /* Resplandor cálido alrededor del agujero negro */
    .resplandor-centro {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 290px;
      height: 290px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 120, 35, 0.55) 18%,
        rgba(255, 55, 25, 0.25) 45%,
        rgba(255, 30, 70, 0) 72%
      );
      pointer-events: none;
      z-index: 4;
    }

    /* Agujero negro en el centro */
    .agujero-negro {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #030305;
      box-shadow:
        0 0 18px 4px rgba(255, 110, 30, 0.85),
        0 0 42px 12px rgba(255, 50, 20, 0.45),
        inset 0 0 14px #000000;
      pointer-events: none;
      z-index: 6;
    }

    #escena-palabras {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .palabra-3d {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-weight: 800;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      will-change: transform, opacity;
    }

    /* Reproductor inferior */
    .reproductor {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(92vw, 430px);
      background: rgba(25, 12, 22, 0.78);
      border: 1px solid rgba(255, 155, 195, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 35;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    #btn-play {
      padding: 10px 15px;
      font-size: 0.95rem;
      background: #ff4788;
      color: #ffffff;
      box-shadow: none;
      flex-shrink: 0;
    }

    .info-audio {
      flex: 1;
      min-width: 0;
    }

    .titulo-audio {
      color: #ffe6f0;
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .barra-progreso {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .progreso-relleno {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff6b9d, #ffbe55);
      transition: width 0.2s linear;
    }

    .tiempo-audio {
      color: #ffd1e3;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 1. Pregunta de cumpleaños -->
  <section id="pantalla-inicio">
    <h1>🎂 ¡Feliz cumpleaños, mi amor lista para celebrar ¿Un año más juntos tú y yo, bebé? 💖</h1>
    <div class="zona-botones">
      <button id="btn-si">¡Sí, bebé! 💕</button>
      <button id="btn-no">No 🙈</button>
    </div>
  </section>

  <!-- 2. Celebración -->
  <section id="pantalla-celebra">
    <h2>¡Sabía que dirías que sí! 🥳💖</h2>
    <p>Por un año más a tu lado y por todos los que vienen. ¡Feliz cumpleaños, mi amor!</p>
    <button id="btn-regalo">🎁 Abre el regalo</button>
  </section>

  <!-- 3. Agujero negro central + pantalla llena de mensajes -->
  <section id="pantalla-universo">
    <div class="resplandor-centro"></div>
    <div class="agujero-negro"></div>
    <div id="escena-palabras"></div>

    <div class="reproductor">
      <button id="btn-play">▶</button>
      <div class="info-audio">
        <div class="titulo-audio">🎵 Como diamantes brillamos</div>
        <div class="barra-progreso">
          <div id="progreso-relleno" class="progreso-relleno"></div>
        </div>
      </div>
      <div id="tiempo-audio" class="tiempo-audio">0:00</div>
      <audio id="audio-regalo" src="cancion.mp3" loop preload="auto"></audio>
    </div>
  </section>

  <script>
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const pantallaCelebra = document.getElementById("pantalla-celebra");
    const pantallaUniverso = document.getElementById("pantalla-universo");
    const btnSi = document.getElementById("btn-si");
    const btnNo = document.getElementById("btn-no");
    const btnRegalo = document.getElementById("btn-regalo");
    const escenaPalabras = document.getElementById("escena-palabras");
    const audio = document.getElementById("audio-regalo");
    const btnPlay = document.getElementById("btn-play");
    const progresoRelleno = document.getElementById("progreso-relleno");
    const tiempoAudio = document.getElementById("tiempo-audio");

    // Botón "No" que escapa al intentar tocarlo o pasar cerca
    function escaparBotonNo() {
      btnNo.style.position = "fixed";
      const margen = 16;
      const maxX = Math.max(margen, window.innerWidth - btnNo.offsetWidth - margen);
      const maxY = Math.max(margen, window.innerHeight - btnNo.offsetHeight - margen);
      const x = margen + Math.random() * (maxX - margen);
      const y = margen + Math.random() * (maxY - margen);
      btnNo.style.left = `${x}px`;
      btnNo.style.top = `${y}px`;
    }

    btnNo.addEventListener("pointerenter", escaparBotonNo);
    btnNo.addEventListener("touchstart", (e) => {
      e.preventDefault();
      escaparBotonNo();
    }, { passive: false });
    btnNo.addEventListener("click", (e) => {
      e.preventDefault();
      escaparBotonNo();
    });

    // Corazones flotantes en pantalla de celebración
    let intervaloCorazones = null;
    function iniciarCorazones() {
      const emojis = ["💖", "💕", "💘", "💗", "✨"];
      intervaloCorazones = setInterval(() => {
        const c = document.createElement("div");
        c.className = "corazon-flotante";
        c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        c.style.left = `${Math.random() * 92}%`;
        c.style.fontSize = `${18 + Math.random() * 18}px`;
        c.style.animationDuration = `${2.6 + Math.random() * 1.8}s`;
        pantallaCelebra.appendChild(c);
        setTimeout(() => c.remove(), 4500);
      }, 220);
    }

    btnSi.addEventListener("click", () => {
      pantallaInicio.style.display = "none";
      pantallaCelebra.style.display = "flex";
      iniciarCorazones();
    });

    // 100 mensajes
    const mensajes = [
      "🎂 ¡Feliz cumpleaños, bebé!", "✨ Un año más juntos", "💕 Tú y yo siempre", "🌟 Eres mi cielo",
      "👑 Mi reina hermosa", "💘 Te amo muchísimo", "💫 Eres mi universo", "🌸 Amo tu sonrisa",
      "❤️ Lo eres todo para mí", "🔥 El amor de mi vida", "💎 Brillamos como diamantes", "🌙 Mi lugar favorito",
      "🥰 Contigo todo es mejor", "🎉 Hoy celebramos tu vida", "💖 Gracias por existir", "🌹 Eres mi mayor regalo",
      "✨ Mi compañera de vida", "💞 Por mil cumpleaños más", "🫶 Mi corazón es tuyo", "☀️ Mi rayito de sol",
      "🦋 Me haces muy feliz", "💫 Juntos contra todo", "🍓 Mi persona favorita", "💓 Cada día te amo más",
      "🌟 Eres única y especial", "🥂 Por nuestra historia", "💝 Mi motivo de sonreír", "🌌 Mi estrella favorita",
      "😘 Eres perfecta para mí", "🎀 Feliz vuelta al sol", "❤️‍🔥 Mi amor eterno", "🌈 Llenas mi vida de luz",
      "🧸 Mi bebé hermosa", "✨ Siempre a tu lado", "💍 Mi presente y futuro", "🎶 Nuestra canción",
      "🎂 Feliz cumple, amor", "💖 Te elegiría mil veces", "✨ Un año lleno de amor", "💕 Mi dulce princesa",
      "🌟 Mi paz y mi alegría", "💘 Nunca dejes de sonreír", "💫 Eres mi sueño cumplido", "🌸 Qué lindo es amarte",
      "❤️ Mi abrazo favorito", "🔥 Tu mirada me encanta", "💎 Más allá de las estrellas", "🌙 Mi noche y mi día",
      "🥰 Gracias por cada momento", "🎉 Pide un deseo hoy", "💖 Eres mi tesoro", "🌹 Hoy es tu gran día",
      "✨ Caminando de tu mano", "💞 Amor de verdad", "🫶 Cuidarte es mi felicidad", "☀️ Iluminas todo",
      "🦋 Magia en tu forma de ser", "💫 Sin ti no sería igual", "🍓 Tan linda y especial", "💓 Mi latido favorito",
      "🌟 Orgulloso de ti", "🥂 Brindemos por nosotros", "💝 Todo lo bonito eres tú", "🌌 Infinito contigo",
      "😘 Un beso hasta el cielo", "🎀 Que seas muy feliz", "❤️‍🔥 Pasión y cariño", "🌈 Colores en mi vida",
      "🧸 Mi chiquita bella", "✨ Cada segundo cuenta", "💍 Promesa de seguir juntos", "🎶 Melodía de mi alma",
      "🎂 Feliz cumpleaños, vida", "💖 Mi complemento ideal", "✨ Un año inolvidable", "💕 Te adoro con el alma",
      "🌟 Brillando a tu lado", "💘 Dueña de mi cariño", "💫 Nuestro propio universo", "🌸 Dulzura infinita",
      "❤️ Por siempre tú y yo", "🔥 Amor que no se apaga", "💎 Valiosa como un diamante", "🌙 Sueños compartidos",
      "🥰 Risas que enamoran", "🎉 Celebrando tu existencia", "💖 Mi mejor casualidad", "🌹 Flor de mi jardín",
      "✨ Paso a paso juntos", "💞 Cariño sincero", "🫶 Siempre te apoyaré", "☀️ Calor de hogar",
      "🦋 Alas para volar juntos", "💫 Destino bonito", "🍓 Lo más tierno que tengo", "💓 Amor que crece",
      "🌟 Luz en mi camino", "🥂 Por muchos años más", "💝 Regalo de la vida", "🌌 Constelación de amor",
      "😘 Eres mi todo", "🎀 Feliz cumpleaños, mi amor"
    ];

    const nodos = [];
    let rotacionY = 0;
    let rotacionX = 0.15;
    const velocidadAutoY = 0.004;
    let arrastrando = false;
    let prevX = 0;
    let prevY = 0;
    let universoActivo = false;

    function crearNubesAlrededorDelCentro() {
      if (universoActivo) return;
      universoActivo = true;

      // 180 elementos usando los 100 mensajes para llenar toda la pantalla (centro + bordes + esquinas)
      const cantidad = 180;
      for (let i = 0; i < cantidad; i++) {
        const el = document.createElement("div");
        el.className = "palabra-3d";
        el.textContent = mensajes[i % mensajes.length];

        const colores = ["#ffd6e7", "#ff9ec4", "#ffca99", "#ffffff", "#ff7aa8", "#ffe4b5"];
        el.style.color = colores[i % colores.length];
        el.style.fontSize = `${12 + (i % 4) * 3}px`;

        const phi = Math.acos(1 - 2 * ((i + 0.5) / cantidad));
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        const radio = 115 + (i % 12) * 38;

        // Se expande horizontal y verticalmente para cubrir toda la pantalla sin dejar vacíos en los lados
        const x0 = radio * Math.sin(phi) * Math.cos(theta) * 1.45;
        const y0 = radio * Math.cos(phi) * 1.15;
        const z0 = radio * Math.sin(phi) * Math.sin(theta) * 0.85;

        escenaPalabras.appendChild(el);
        nodos.push({ el, x0, y0, z0 });
      }

      const focal = 520;

      function renderizar() {
        const cosY = Math.cos(rotacionY);
        const sinY = Math.sin(rotacionY);
        const cosX = Math.cos(rotacionX);
        const sinX = Math.sin(rotacionX);

        for (const n of nodos) {
          let x1 = n.x0 * cosY - n.z0 * sinY;
          let z1 = n.z0 * cosY + n.x0 * sinY;
          let y1 = n.y0;

          let y2 = y1 * cosX - z1 * sinX;
          let z2 = z1 * cosX + y1 * sinX;

          const profundidad = focal + z2;
          const escala = Math.max(0.45, focal / Math.max(180, profundidad));
          const px = x1 * escala;
          const py = y2 * escala;

          // Mantiene libre únicamente el núcleo oscuro del agujero negro de 92px
          const distCentro = Math.hypot(px, py);
          const radioNucleo = 48;
          let finalX = px;
          let finalY = py;
          if (distCentro < radioNucleo && distCentro > 0.1) {
            const factor = radioNucleo / distCentro;
            finalX = px * factor;
            finalY = py * factor;
          }

          const opacidad = Math.min(1, Math.max(0.32, (z2 + 380) / 760));
          n.el.style.opacity = opacidad.toFixed(2);
          n.el.style.zIndex = z2 > 0 ? "12" : "5";
          n.el.style.transform = `translate(-50%, -50%) translate3d(${finalX.toFixed(1)}px, ${finalY.toFixed(1)}px, 0) scale(${escala.toFixed(2)})`;
        }

        if (!arrastrando) {
          rotacionY += velocidadAutoY;
        }
        requestAnimationFrame(renderizar);
      }

      renderizar();
    }

    pantallaUniverso.addEventListener("pointerdown", (e) => {
      arrastrando = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
      if (!arrastrando) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      prevX = e.clientX;
      prevY = e.clientY;
      rotacionY += dx * 0.008;
      rotacionX = Math.max(-0.9, Math.min(0.9, rotacionX + dy * 0.005));
    });

    window.addEventListener("pointerup", () => {
      arrastrando = false;
    });

    // Controles de audio (cancion.mp3)
    function formatearTiempo(seg) {
      if (!Number.isFinite(seg) || seg < 0) return "0:00";
      const m = Math.floor(seg / 60);
      const s = Math.floor(seg % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    audio.addEventListener("timeupdate", () => {
      tiempoAudio.textContent = formatearTiempo(audio.currentTime);
      if (audio.duration > 0) {
        progresoRelleno.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
      }
    });

    audio.addEventListener("play", () => {
      btnPlay.textContent = "❚❚";
    });

    audio.addEventListener("pause", () => {
      btnPlay.textContent = "▶";
    });

    btnPlay.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    btnRegalo.addEventListener("click",()=>{
      clearInterval(intervaloCorazones);
      pantallaCelebra.style.display="none";
      pantallaUniverso.style.display="block";
      crearNubesAlrededorDelCentro();
      audio.play().catch(()=>{});
    });
  </script>
</body>
</html>
