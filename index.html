<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz Cumpleaños, Mi Amor!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; touch-action: manipulation; }

    .pantalla-rosa {
      min-height: 100vh;
      width: 100vw;
      background: linear-gradient(180deg, #ff9ebb, #ff6b9d);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    h1 {
      color: #fff;
      font-size: 1.85rem;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      margin-bottom: 36px;
      max-width: 540px;
    }

    .botones {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 140px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
    }

    #btn-si {
      background: #ff2e79;
      color: #fff;
      z-index: 2;
    }

    #btn-no {
      background: #fff;
      color: #ff2e79;
      position: relative;
      z-index: 2;
    }

    #pantalla-celebra, #pantalla-universo {
      display: none;
      min-height: 100vh;
      width: 100vw;
      position: fixed;
      inset: 0;
    }

    #pantalla-celebra {
      background: linear-gradient(180deg, #ff85b3, #ff4d8d);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #btn-regalo {
      margin-top: 28px;
      background: #fff;
      color: #ff2e79;
      font-size: 1.2rem;
    }

    #pantalla-universo {
      background: radial-gradient(circle at center, #3b0d09 0%, #140507 55%, #060408 100%);
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }

    /* Agujero negro central con halo */
    .agujero-negro {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 110px;
      height: 110px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #050507;
      box-shadow:
        0 0 22px 8px rgba(255, 90, 30, 0.75),
        0 0 55px 22px rgba(255, 45, 85, 0.38),
        inset 0 0 18px #000;
      z-index: 5;
      pointer-events: none;
    }

    .palabra {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-weight: 700;
      user-select: none;
      text-shadow: 0 0 12px rgba(255, 110, 140, 0.55);
      pointer-events: none;
      z-index: 10;
    }

    .reproductor {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 420px);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .reproductor button {
      padding: 10px 16px;
      font-size: 0.95rem;
      background: #ff4d8d;
      color: #fff;
      box-shadow: none;
    }

    .titulo-cancion {
      font-size: 0.9rem;
      color: #ffe3ee;
      flex: 1;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- 1. Pregunta de cumpleaños -->
  <section id="pantalla-inicio" class="pantalla-rosa">
    <h1>🎂 ¡Feliz cumpleaños, mi amor! Lista para celebrar un año más juntos. ¿Un año más juntos tú y yo, bebé? 💖</h1>
    <div class="botones">
      <button id="btn-si">¡Sí, bebé! 💕</button>
      <button id="btn-no">No 🙈</button>
    </div>
  </section>

  <!-- 2. Confirmación y botón de regalo -->
  <section id="pantalla-celebra">
    <h1 style="margin-bottom: 12px;">¡Sabía que dirías que sí! 🥳💖</h1>
    <p style="font-size: 1.15rem; max-width: 440px;">
      Por un año más a tu lado y por todos los que vienen. ¡Feliz cumpleaños, mi amor!
    </p>
    <button id="btn-regalo">🎁 Abre el regalo</button>
  </section>

  <!-- 3. Universo de palabras con agujero negro central -->
  <section id="pantalla-universo">
    <div class="agujero-negro"></div>
    <div id="contenedor-palabras"></div>
    <div class="reproductor">
      <button id="btn-play">▶ / ❚❚</button>
      <div class="titulo-cancion">🎵 Nuestra canción de cumpleaños</div>
      <audio id="audio-regalo" src="cancion.mp3" loop></audio>
    </div>
  </section>

  <script>
    const btnNo = document.getElementById("btn-no");
    const btnSi = document.getElementById("btn-si");
    const btnRegalo = document.getElementById("btn-regalo");
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const pantallaCelebra = document.getElementById("pantalla-celebra");
    const pantallaUniverso = document.getElementById("pantalla-universo");
    const contenedorPalabras = document.getElementById("contenedor-palabras");
    const audio = document.getElementById("audio-regalo");
    const btnPlay = document.getElementById("btn-play");

    function moverBotonNo() {
      btnNo.style.position = "fixed";
      const maxX = window.innerWidth - btnNo.offsetWidth - 20;
      const maxY = window.innerHeight - btnNo.offsetHeight - 20;
      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);
      btnNo.style.left = `${x}px`;
      btnNo.style.top = `${y}px`;
    }

    btnNo.addEventListener("pointerenter", moverBotonNo);
    btnNo.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moverBotonNo();
    });
    btnNo.addEventListener("click", (e) => {
      e.preventDefault();
      moverBotonNo();
    });

    btnSi.addEventListener("click", () => {
      pantallaInicio.style.display = "none";
      pantallaCelebra.style.display = "flex";
    });

    const palabras = [
      "Feliz cumpleaños", "Un año más juntos", "Tú y yo", "Mi amor",
      "Mi cielo", "Eres todo", "Mi vida", "Siempre juntos",
      "Mi lugar favorito", "Hermosa", "Amor eterno", "Mi alegría"
    ];

    const orbitas = [];
    let rotacionExtra = 0;
    let arrastrando = false;
    let ultimoX = 0;
    let universoIniciado = false;

    function crearUniverso() {
      if (universoIniciado) return;
      universoIniciado = true;

      const total = 44;
      for (let i = 0; i < total; i++) {
        const el = document.createElement("div");
        el.className = "palabra";
        el.textContent = palabras[i % palabras.length];
        const tam = 13 + Math.random() * 13;
        el.style.fontSize = `${tam}px`;
        el.style.color = i % 3 === 0 ? "#ffd6e7" : (i % 3 === 1 ? "#ff94b8" : "#ffcab0");

        // Radio mínimo fuera del agujero negro (centro ~55px de radio)
        const radioX = 85 + Math.random() * Math.max(110, window.innerWidth * 0.42);
        const radioY = 80 + Math.random() * Math.max(120, window.innerHeight * 0.42);

        orbitas.push({
          el,
          angulo: Math.random() * Math.PI * 2,
          velocidad: (0.002 + Math.random() * 0.004) * (i % 2 === 0 ? 1 : -1),
          radioX,
          radioY,
          escala: 0.8 + Math.random() * 0.45
        });
        contenedorPalabras.appendChild(el);
      }

      function animar() {
        for (const item of orbitas) {
          item.angulo += item.velocidad;
          const a = item.angulo + rotacionExtra;
          const x = Math.cos(a) * item.radioX;
          const y = Math.sin(a) * item.radioY;
          item.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${item.escala})`;
        }
        requestAnimationFrame(animar);
      }
      animar();
    }

    pantallaUniverso.addEventListener("pointerdown", (e) => {
      arrastrando = true;
      ultimoX = e.clientX;
    });

    window.addEventListener("pointermove", (e) => {
      if (!arrastrando) return;
      const dx = e.clientX - ultimoX;
      ultimoX = e.clientX;
      rotacionExtra += dx * 0.006;
    });

    window.addEventListener("pointerup", () => {
      arrastrando = false;
    });

    btnRegalo.addEventListener("click", () => {
      pantallaCelebra.style.display = "none";
      pantallaUniverso.style.display = "block";
      crearUniverso();
      audio.play().catch(() => {});
    });

    btnPlay.addEventListener("click", () => {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
  </script>
</body>
</html>
