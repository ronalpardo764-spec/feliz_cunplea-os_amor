<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz Cumpleaños, Mi Amor!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; touch-action: manipulation; }

    .pantalla-rosa {
      min-height: 100vh;
      width: 100vw;
      background: linear-gradient(180deg, #ff9ebb, #ff6b9d);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    h1 {
      color: #fff;
      font-size: 1.85rem;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      margin-bottom: 36px;
      max-width: 540px;
    }

    .botones {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 140px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
    }

    #btn-si {
      background: #ff2e79;
      color: #fff;
      z-index: 2;
    }

    #btn-no {
      background: #fff;
      color: #ff2e79;
      position: relative;
      z-index: 2;
    }

    #pantalla-celebra, #pantalla-universo {
      display: none;
      min-height: 100vh;
      width: 100vw;
      position: fixed;
      inset: 0;
    }

    #pantalla-celebra {
      background: linear-gradient(180deg, #ff85b3, #ff4d8d);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #btn-regalo {
      margin-top: 28px;
      background: #fff;
      color: #ff2e79;
      font-size: 1.2rem;
    }

    #pantalla-universo {
      background: radial-gradient(circle at center, #2b0918 0%, #09060c 75%);
      color: #fff;
      overflow: hidden;
    }

    .palabra {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      user-select: none;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.65);
      pointer-events: none;
    }

    .reproductor {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 420px);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .reproductor button {
      padding: 10px 16px;
      font-size: 0.95rem;
      background: #ff4d8d;
      color: #fff;
      box-shadow: none;
    }

    .titulo-cancion {
      font-size: 0.9rem;
      color: #ffe3ee;
      flex: 1;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- 1. Pregunta de cumpleaños -->
  <section id="pantalla-inicio" class="pantalla-rosa">
    <h1>🎂 ¡Feliz cumpleaños, mi amor! Lista para celebrar un año más juntos. ¿Un año más juntos tú y yo, bebé? 💖</h1>
    <div class="botones">
      <button id="btn-si">¡Sí, bebé! 💕</button>
      <button id="btn-no">No 🙈</button>
    </div>
  </section>

  <!-- 2. Confirmación y botón de regalo -->
  <section id="pantalla-celebra">
    <h1 style="margin-bottom: 12px;">¡Sabía que dirías que sí! 🥳💖</h1>
    <p style="font-size: 1.15rem; max-width: 440px;">
      Por un año más a tu lado y por todos los que vienen. ¡Feliz cumpleaños, mi amor!
    </p>
    <button id="btn-regalo">🎁 Abre el regalo</button>
  </section>

  <!-- 3. Universo de palabras y reproductor -->
  <section id="pantalla-universo">
    <div id="contenedor-palabras"></div>
    <div class="reproductor">
      <button id="btn-play">▶ / ❚❚</button>
      <div class="titulo-cancion">🎵 Nuestra canción de cumpleaños</div>
      <audio id="audio-regalo" src="cancion.mp3" loop></audio>
    </div>
  </section>

  <script>
    const btnNo = document.getElementById("btn-no");
    const btnSi = document.getElementById("btn-si");
    const btnRegalo = document.getElementById("btn-regalo");
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const pantallaCelebra = document.getElementById("pantalla-celebra");
    const pantallaUniverso = document.getElementById("pantalla-universo");
    const contenedorPalabras = document.getElementById("contenedor-palabras");
    const audio = document.getElementById("audio-regalo");
    const btnPlay = document.getElementById("btn-play");

    function moverBotonNo() {
      btnNo.style.position = "fixed";
      const maxX = window.innerWidth - btnNo.offsetWidth - 20;
      const maxY = window.innerHeight - btnNo.offsetHeight - 20;
      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);
      btnNo.style.left = `${x}px`;
      btnNo.style.top = `${y}px`;
    }

    btnNo.addEventListener("pointerenter", moverBotonNo);
    btnNo.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moverBotonNo();
    });
    btnNo.addEventListener("click", (e) => {
      e.preventDefault();
      moverBotonNo();
    });

    btnSi.addEventListener("click", () => {
      pantallaInicio.style.display = "none";
      pantallaCelebra.style.display = "flex";
    });

    const palabras = [
      "Feliz cumpleaños", "Un año más juntos", "Tú y yo", "Mi amor",
      "Mi cielo", "Eres todo", "Mi vida", "Siempre juntos",
      "Mi lugar favorito", "Hermosa", "Amor eterno", "Mi alegría"
    ];

    const elementos = [];

    function crearUniverso() {
      for (let i = 0; i < 42; i++) {
        const el = document.createElement("div");
        el.className = "palabra";
        el.textContent = palabras[i % palabras.length];
        el.style.fontSize = `${14 + Math.random() * 14}px`;
        el.style.color = i % 2 === 0 ? "#ffd1e6" : "#ff85b3";

        const item = {
          el,
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 1.2,
          vy: -0.5 - Math.random() * 1.1
        };
        elementos.push(item);
        contenedorPalabras.appendChild(el);
      }

      function animar() {
        for (const item of elementos) {
          item.x += item.vx;
          item.y += item.vy;

          if (item.y < -40) item.y = window.innerHeight + 30;
          if (item.x < -120) item.x = window.innerWidth + 80;
          if (item.x > window.innerWidth + 120) item.x = -80;

          item.el.style.transform = `translate(${item.x}px, ${item.y}px)`;
        }
        requestAnimationFrame(animar);
      }
      animar();
    }

    pantallaUniverso.addEventListener("pointermove", (e) => {
      for (const item of elementos) {
        const dx = item.x - e.clientX;
        const dy = item.y - e.clientY;
        const dist = Math.hypot(dx, dy);
        if (dist < 110 && dist > 0) {
          item.x += (dx / dist) * 4;
          item.y += (dy / dist) * 4;
        }
      }
    });

    btnRegalo.addEventListener("click", () => {
      pantallaCelebra.style.display = "none";
      pantallaUniverso.style.display = "block";
      crearUniverso();
      audio.play().catch(() => {});
    });

    btnPlay.addEventListener("click", () => {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
  </script>
</body>
</html>
